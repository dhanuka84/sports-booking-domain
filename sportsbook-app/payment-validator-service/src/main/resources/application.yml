spring:
  application:
    name: payment-validator-service
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:29092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # We can keep this line or even drop it if your ConsumerFactory creates the JsonDeserializer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      # REMOVE the whole `properties:` block to avoid double configuration
      # properties:
      #   spring.json.trusted.packages: "com.sportsbook.payment.contracts"
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_validator
    username: payment
    password: payment
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

psv:
  topics:
    deposit-ingest: deposit-ingest
    deposit-enriched: deposit-enriched
    deposit-validated: deposit-validated
    deposit-rejected: deposit-rejected
    deposit-commands: deposit-commands
    deposit-events: deposit-events
  nordic-api:
    base-url: http://localhost:8089

resilience4j:
  circuitbreaker:
    instances:
      bankApiBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 2
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
