spring:
  application:
    name: payment-validator-service
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.sportsbook.payment.contracts"
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_validator
    username: payment
    password: payment
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

psv:
  topics:
    deposit-ingest: deposit-ingest
    deposit-enriched: deposit-enriched
    deposit-validated: deposit-validated
    deposit-rejected: deposit-rejected
    deposit-commands: deposit-commands
    deposit-events: deposit-events

resilience4j:
  circuitbreaker:
    instances:
      bankApiBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
